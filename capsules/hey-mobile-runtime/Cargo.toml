[package]
name = "hey-mobile-runtime"
description = "On-device mini-runtime for the Hey mobile apps. Embeds the iroh-1.0 carrier (elastos://peer/*), a local biometric-gated identity (elastos://identity/*), file storage, and a content CAS — and serves them over a loopback HTTP server that the WASM capsule (hey-social / hey-chat) talks to UNMODIFIED. No external runtime, no wallet, no child processes: one process, one .so. The phone IS the runtime."
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["HeyElastos"]

# cdylib  -> libhey_mobile_runtime.so for the Android app (JNI entry).
# staticlib -> libhey_mobile_runtime.a for the iOS xcframework (C-ABI, src/ios.rs).
# rlib    -> so `examples/dev.rs` (host smoke harness) can link the lib.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Reuse the security core verbatim so on-device crypto/identity stays
# byte-identical to the browser + CLI builds (one audit surface).
hey-core = { path = "../hey-core" }

# Built-in carrier transport — EXACT versions the rest of the Hey workspace
# pins (peer-provider / blobs-provider), so the tree resolves to one iroh and
# we inherit the iroh-1.0-rc.1 relay->direct hole-punch fix (runtime patch 0018).
iroh = "1.0.0-rc.1"
iroh-gossip = "0.100"
# LAN address lookup over mDNS — lets two devices on the SAME network discover each
# other's LOCAL address and connect DIRECTLY (no relay, no NAT). n0's official crate;
# 0.3 targets iroh 1.0-rc.1. Needs a WifiManager.MulticastLock on Android to receive.
iroh-mdns-address-lookup = "0.3"
# Same netdev iroh/netwatch resolve to (our patched vendored copy via [patch.crates-io]) — used to
# enumerate real interface addresses on Android for the connection UI + direct detection, since the
# UDP-connect probe is unreliable through VPN tunnels.
netdev = "0.43"
# Direct P2P content (cross-device media). 0.102 is the ONLY blobs release that
# pins iroh "=1.0.0-rc.1" (0.101→rc.0, 0.100→0.98), so the tree keeps ONE iroh and
# the gossip messaging path is untouched. Same crate the desktop blobs-provider uses.
iroh-blobs = "0.102"
n0-future = "0.2"
bytes = "1"
blake3 = "1"
# Parse relay URLs into iroh RelayConfig (same crate iroh re-exports).
url = "2"

# Loopback HTTP surface the WASM capsule fetches (same-origin: serves both the
# dist AND /api/*, so api_base() == "" resolves correctly — see hey-core runtime.rs:88).
axum = "0.7"
tower-http = { version = "0.5", features = ["fs", "cors"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "io-util"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
base64 = "0.22"
data-encoding = "2"  # BASE32_NOPAD — match upstream elastos-server carrier ticket encoding
bip39 = { version = "2", features = ["rand"] }  # BIP39 recovery phrase = the one root (Essentials-recoverable)
getrandom = "0.2"
# Defense-in-depth: wipe the in-memory seed / X25519 / ML-KEM secret on Identity
# drop. Already in the tree (transitive via hey-core + x25519-dalek's zeroize
# feature); declared directly so identity.rs can call it. Same 1.8.2 the lock pins.
zeroize = "1"

# ── ESC (Elastos Smart Chain) wallet — same mnemonic, Essentials-recoverable ──
# All pure-Rust except ureq's TLS, which reuses the rustls backend iroh already
# cross-compiles, so no new C-toolchain surface for Android.
bip32 = "0.5"                                   # BIP44 m/44'/60'/0'/0/0 (secp256k1)
k256 = { version = "0.13", features = ["ecdsa"] }  # secp256k1 sign + pubkey
sha3 = "0.10"                                    # Keccak256 (Ethereum address + tx hash)
ureq = { version = "2", features = ["json"] }    # blocking TLS JSON-RPC to ESC
# did:elastos (EID) + ELA mainchain — Elastos runs BIP32 over secp256r1 (P-256),
# NOT secp256k1 (forked bitcoinj). One P-256 derivation yields both identifiers.
p256 = "0.13"                                    # NIST P-256 curve (the Elastos DID/wallet curve)
hmac = "0.12"                                    # BIP32 CKD (HMAC-SHA512)
sha2 = "0.10"                                    # SHA-256/512
ripemd = "0.1"                                   # RIPEMD-160 (address hash)
bs58 = "0.5"                                     # Base58 (Elastos address encoding)
# Ed25519 pubkey-from-seed (did:key) — same crate/version hey-core::identity uses,
# so the derived DID matches the engine exactly.
ed25519-compact = { version = "2", default-features = false }
# Our own logs go through the `log` facade so they surface in `adb logcat`
# (android_logger bridges it) and on host (env_logger in examples/dev.rs).
log = "0.4"

# JNI bridge — only compiled into the Android .so. Kotlin calls nativeStart().
[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }
# Low-level logcat sink for our ring-buffer logger (logbuf.rs).
android_log-sys = "0.3"

[dev-dependencies]
env_logger = "0.11"

# Host smoke harness: `cargo run --example dev -- <dist_dir>` brings the whole
# mini-runtime up on 127.0.0.1 so you can point a desktop browser at it before
# any phone is involved.
[[example]]
name = "dev"
path = "examples/dev.rs"
