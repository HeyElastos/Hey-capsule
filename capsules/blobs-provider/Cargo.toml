[package]
name = "blobs-provider"
description = "iroh-blobs direct peer-to-peer file transfer for hey-chat"
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["HeyElastos"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "fs", "sync", "signal", "time"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"
bytes = "1"
blake3 = "1"

# One transport generation across the whole product line: the SAME iroh the Hyper
# desktop/Skia apps and hey-mobile-runtime resolve (1.0.2 / gossip 0.101 / blobs
# 0.103), arriving PATCHED via the [patch.crates-io] block at the bottom of this
# file. peer-provider is on the identical line, so the pack keeps a single iroh.
# Backs the federation pin mesh.
iroh = "1.0.2"
iroh-blobs = "0.103"
iroh-gossip = "0.101"
# RESOLVER PIN, not a code dependency — see the same pin in peer-provider. The
# vendored iroh calls noq_udp::hyper_rearm_dead_families, which exists only in
# the vendored noq-udp 1.0.1, so the two are a matched pair; without this a
# from-scratch resolve pulls noq-udp 1.1.1, [patch.crates-io] silently stops
# applying, and the build fails on the missing function.
noq-udp = "=1.0.1"
n0-future = "0.2"

[[bin]]
name = "blobs-provider"
path = "src/main.rs"

[[bin]]
name = "blobs-transfer-test"
path = "src/bin/transfer_test.rs"

# STANDALONE WORKSPACE ROOT — deliberate. The YunoHost package builds this
# provider by `cd`-ing into this directory (elastos-runtime_ynh
# scripts/_common.sh build_runtime_and_capsules), where the pack's root
# Cargo.toml does NOT exist: fetch_hey_capsules() copies only capsules/*, so on
# the box there is no workspace root above this crate. Without its own root the
# pack-root [patch.crates-io] never reached it and the VPS silently built
# UNPATCHED crates.io iroh while every other Hyper product ran patched.
[workspace]

# SAME PATCHES AS EVERY OTHER PRODUCT — see the pack root Cargo.toml for the full
# rationale. `../vendor/*` resolves identically in BOTH layouts: in the pack
# checkout it is capsules/vendor/, on the box it is $install_dir/capsules/vendor/.
# Kept byte-identical to hey-engine/vendor by scripts/sync-vendor.sh.
[patch.crates-io]
iroh = { path = "../vendor/iroh" }
iroh-gossip = { path = "../vendor/iroh-gossip" }
netdev = { path = "../vendor/netdev" }
noq-udp = { path = "../vendor/noq-udp" }
