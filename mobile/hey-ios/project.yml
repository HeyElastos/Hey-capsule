# XcodeGen spec — run `xcodegen generate` on a Mac to produce HeySocial.xcodeproj
# https://github.com/yonaskolb/XcodeGen
name: HeySocial
options:
  bundleIdPrefix: os.elastos.hey
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "" # set your Apple Developer Team ID
    CODE_SIGN_STYLE: Automatic

# Shared App Group + Keychain group so the app and the NSE share keys + the bid→topic map.
# (See docs/HEY_IOS_PUSH_GATEWAY.md §5.)
packages: {}

targets:
  HeySocial:
    type: application
    platform: iOS
    sources:
      - path: Sources/HeySocial
    resources:
      - path: Resources/Assets.xcassets
        optional: true
    info:
      path: Resources/HeySocial-Info.plist
      properties:
        CFBundleDisplayName: Hey
        UILaunchScreen: {}
        UIBackgroundModes: [remote-notification, voip, fetch, processing]
        BGTaskSchedulerPermittedIdentifiers: [os.elastos.hey.social.refresh]
        NSCameraUsageDescription: Take photos and videos to share.
        NSPhotoLibraryUsageDescription: Attach photos and videos to posts and chats.
        NSMicrophoneUsageDescription: Voice messages and calls.
        NSFaceIDUsageDescription: Unlock Hey and protect your recovery phrase with Face ID.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Resources/HeySocial.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [group.os.elastos.hey.shared]
        keychain-access-groups: ["$(AppIdentifierPrefix)os.elastos.hey.messaging"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: os.elastos.hey.social
        # Link the engine xcframework once built (scripts/build-rust-xcframework.sh).
        # Until then the app runs on MockEngine — no native dependency required.
        OTHER_LDFLAGS: "$(inherited)"
    dependencies:
      - target: HeyNotificationService
      - framework: Frameworks/HeyEngine.xcframework
        embed: true
        optional: true   # absent until the engine is built; UI runs on MockEngine

  HeyNotificationService:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/HeyNotificationService
    info:
      path: Resources/HeyNotificationService-Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: Resources/HeyNotificationService.entitlements
      properties:
        com.apple.security.application-groups: [group.os.elastos.hey.shared]
        keychain-access-groups: ["$(AppIdentifierPrefix)os.elastos.hey.messaging"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: os.elastos.hey.social.nse
    dependencies:
      - framework: Frameworks/HeyEngine.xcframework
        embed: false
        optional: true
