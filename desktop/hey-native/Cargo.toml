[package]
name = "hey-native"
version = "0.0.1"
edition = "2021"
license = "MIT"
authors = ["HeyElastos"]
description = "Native Rust/egui desktop port of the all-in-one Hey Social app; embeds hey-mobile-runtime in-process (no JNI, no WebView, no Tauri)."

[[bin]]
name = "hey-native"
path = "src/main.rs"

[dependencies]
# Lean eframe: glow (OpenGL) backend, drop accesskit/atspi to keep the build
# light and avoid extra system deps. x11 + wayland so it runs on either.
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
egui = "0.29"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync"] }
# Cross-platform native file dialogs. The Linux backend (xdg-desktop-portal) is
# added only on Linux (target section below); Windows/macOS use native dialogs.
rfd = { version = "0.15", default-features = false, features = ["tokio"] }
serde_json = "1"
crossbeam-channel = "0.5"
# QR for the friend-invite sheets — core only (we rasterise the matrix ourselves).
qrcode = { version = "0.14", default-features = false }
dirs = "5"
log = "0.4"
env_logger = "0.11"
# Cross-platform OS desktop notifications (Linux dbus/libnotify, macOS, Windows) —
# the desktop parity for Android's RuntimeService.notifyEvent. Best-effort only.
notify-rust = "4"
# Cross-platform OS secret store. Holds the 32-byte at-rest DEK that seals
# identity.json — the desktop parity for Android's hardware-wrapped storage key.
# macOS Keychain + Windows credential manager via their native backends; Linux via
# secret-service (GNOME Keyring / KWallet). MUST be a PERSISTENT store: the DEK
# seals identity.json, so a non-persistent backend (kernel keyutils, which is wiped
# on reboot) would make the sealed seed unreadable after a restart = data loss.
# Linux uses `async-secret-service` (the PURE-RUST zbus backend) + `crypto-rust` +
# the light `async-io` runtime — disk-backed/persistent AND C-free (NOTE:
# `sync-secret-service` would pull `dbus-secret-service`→`libdbus-sys`, a C dep that
# needs dbus-1 dev headers; async-secret-service avoids it). The keyring Entry API
# stays sync. Headless hosts with no secret-service fall back to plaintext gracefully.
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "async-secret-service", "crypto-rust", "async-io"] }
# Base64 for the keyring-stored DEK (the secret store wants a string value), and
# a cross-platform CSPRNG to mint a fresh DEK on first run.
base64 = "0.22"
getrandom = "0.2"
# Cross-platform audio capture + playback for 1:1 voice calls. Linux backend = ALSA
# (build needs alsa-lib pkgconfig; this repo points PKG_CONFIG_PATH at brew alsa-lib).
# We feed/drain hey-mobile-runtime's voice plane (8 kHz mono i16) and resample to the
# device-native rate ourselves (small inline linear resampler — no rubato dep).
cpal = "0.15"

# The embedded on-device runtime (carrier + content + identity + social API).
# Path deps so the iroh/hey-core instance is byte-identical to the mobile build.
hey-mobile-runtime = { path = "../../capsules/hey-mobile-runtime" }
hey-core = { path = "../../capsules/hey-core" }

# Linux file-dialog backend (xdg-desktop-portal — no GTK headers needed). On
# Windows/macOS rfd uses the OS-native dialog, so no extra feature is required.
[target.'cfg(target_os = "linux")'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal"] }

# Detach from the parent pack workspace (which pins rustc 1.89 and lists
# hey-mobile-runtime as a member). This crate is its OWN workspace root and
# builds with rustc 1.91 (see rust-toolchain.toml) to match iroh-1.0-rc.1.
[workspace]

[profile.dev]
debug = 0          # frugal: no debuginfo — /var/home is tight and iroh is heavy
