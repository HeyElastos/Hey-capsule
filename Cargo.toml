[workspace]
# Convenience workspace for development at the pack root.
#
# blobs-provider and peer-provider are NOT members: they are their own workspace
# roots so they carry the vendored-iroh [patch.crates-io] themselves. The
# YunoHost package builds them by `cd`-ing into their directories, where this
# root does not exist, and a member crate cannot hold its own [patch] — so as
# members they silently built UNPATCHED crates.io iroh on the box. Build them
# with `cargo build --manifest-path capsules/<name>/Cargo.toml` (or cd in).
#
# hey-social is a wasm32-only Leptos crate; build it with
# `trunk build` from its directory, not `cargo build` at the root.
resolver = "2"
members = [
    "capsules/content-provider",
    "capsules/docs-provider",
    "capsules/identity-projection-provider",
    "capsules/hey-social",
    # Rust/Leptos messenger (Telegram-desktop replacement) — wasm32-only,
    # built with trunk; kept out of default-members like hey-social.
    "capsules/hey-chat",
    # The unified Hyper shell — the desktop app's design language as a capsule.
    # wasm32-only, trunk-built, same exclusion from default-members.
    "capsules/hyper-desktop",
    # Native headless diagnostic CLI for the cross-runtime DM flow — drives
    # hey-core natively. Build explicitly with `cargo build -p hey-chat-cli`.
    "capsules/hey-chat-cli",
    # Native headless diagnostic CLI for the hey-social FOLLOW + post-feed flow
    # — drives the same hey-core transport/identity/content natively and speaks
    # hey-social's interoperable events (follow.request / posts.head / index).
    # Build explicitly with `cargo build -p hey-social-cli`.
    "capsules/hey-social-cli",
]
default-members = [
    "capsules/content-provider",
    "capsules/docs-provider",
    "capsules/identity-projection-provider",
]
# Cargo auto-adopts any path dependency living inside the workspace directory as
# a member. Without this, the vendored crates below (and the two standalone
# providers) would be pulled back in and Cargo would error on their own
# [workspace]/[patch] keys.
exclude = [
    "capsules/blobs-provider",
    "capsules/peer-provider",
    "capsules/vendor",
]

[profile.release]
opt-level = 3
lto = true

# NO [patch.crates-io] HERE — deliberate, do not "restore" it.
#
# The vendored transport fixes (iroh remote-map leak, gossip per-peer dial
# backoff, netdev Android heal, noq-udp ENETUNREACH backoff) live in
# capsules/vendor/ and are applied by the ONLY two crates in this pack that
# speak iroh: capsules/peer-provider and capsules/blobs-provider, each of which
# is its own workspace root and carries the [patch.crates-io] block itself.
#
# It has to be that way round. The YunoHost package builds those two by `cd`-ing
# into their directories, where this root does not exist — so a patch block here
# would apply in a dev checkout and silently NOT apply on the box, which is the
# exact failure this mechanism exists to prevent. Nothing else here pulls iroh
# (hey-core does not), so a block here would also just be four
# "patch was not used in the crate graph" warnings on every build.
#
# Keep capsules/vendor/ byte-identical to hey-engine/vendor/ with
# ./scripts/sync-vendor.sh (CI runs it with --check).

